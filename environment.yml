# Conda source specification — the input to conda-lock.
#
# This is the conda-side counterpart to pyproject.toml's dependency list;
# version ranges are kept in sync with it by hand (see CONTRIBUTING.md).
# Do not install from this file directly for a reproducible environment —
# it holds ranges, not pinned versions. Use conda-lock.yml instead:
#
#     conda-lock install --name actgpr conda-lock.yml
#
# Regenerate conda-lock.yml after changing anything here:
#
#     conda-lock lock -f environment.yml -p linux-64 -p osx-64 -p osx-arm64 -p win-64
#
# Package names differ from PyPI in two places: torch is `pytorch` on
# conda-forge, and sphinx-rtd-theme is `sphinx_rtd_theme`.
name: actgpr
channels:
  - conda-forge
dependencies:
  - python >=3.13,<3.15
  # Runtime
  # Held to 2.12.x rather than pyproject.toml's wider <3.0.0 range so conda
  # resolves the same minor version poetry.lock pins. Left wider, conda-forge
  # picks 2.13 on linux-64/win-64 while Poetry stays on 2.12 — the regression
  # baseline (tests/regression/data, compared at rtol=1e-6) is generated
  # against 2.12, so the two install paths must not diverge here.
  - pytorch >=2.12.0,<2.13
  - gpytorch >=1.15.2,<2.0.0
  - matplotlib >=3.11.0,<4.0.0
  - h5py >=3.16.0,<4.0.0
  # Development — mirrors pyproject.toml's dev dependency group, so a conda
  # environment can run the same lint/test/docs gate as a Poetry one.
  - pytest >=9.1.0,<10.0.0
  - black >=26.5.1,<27.0.0
  - ruff >=0.15.17,<0.16.0
  - sphinx >=9.1.0,<10.0.0
  - sphinx_rtd_theme >=3.1.0,<4.0.0
