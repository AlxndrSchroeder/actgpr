name: CI

on:
  push:
    branches: [main]
  pull_request:

# Avoid two Pages deployments racing each other.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install poetry
        run: pipx install poetry
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "poetry"
      - name: Install dependencies
        run: poetry install
      - name: Check formatting (black)
        run: poetry run black --check src/ tests/
      - name: Lint (ruff)
        run: poetry run ruff check src/ tests/

  test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install poetry
        run: pipx install poetry
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "poetry"
      - name: Install dependencies
        run: poetry install
      - name: Run tests (unit, integration, regression)
        run: poetry run pytest tests/

  # Verifies the alternative conda install path, so it cannot rot unnoticed:
  # conda-lock.yml must stay in sync with environment.yml, and the resulting
  # environment must pass the same test suite as the Poetry one. Runs in
  # parallel with `test` — it gates the pull request, not the docs build.
  conda:
    needs: lint
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
      - name: Install conda-lock
        run: pip install conda-lock
      - name: Check conda-lock.yml is in sync with environment.yml
        # --check-input-hash skips the solve when environment.yml's hash still
        # matches the one recorded in conda-lock.yml, and re-solves (rewriting
        # the file) when it doesn't. Staleness is therefore detected by whether
        # the file changed, not by the exit code — conda-lock returns 0 both
        # when it skips and when it regenerates. Exit codes are only used to
        # tell a successful run from a genuine tool failure (4 is documented as
        # "nothing was updated" and is also a success).
        run: |
          set +e
          conda-lock lock --check-input-hash -f environment.yml \
            -p linux-64 -p osx-64 -p osx-arm64 -p win-64
          status=$?
          set -e
          if [ "$status" -ne 0 ] && [ "$status" -ne 4 ]; then
            echo "::error::conda-lock failed with exit code $status"
            exit "$status"
          fi
          if git diff --quiet -- conda-lock.yml; then
            echo "conda-lock.yml is in sync with environment.yml"
          else
            echo "::error::conda-lock.yml is stale. Re-run 'conda-lock lock --micromamba -f environment.yml -p linux-64 -p osx-64 -p osx-arm64 -p win-64' and commit the result."
            exit 1
          fi
      - name: Create environment from the lock file
        run: conda-lock install --name actgpr conda-lock.yml
      - name: Install actgpr itself
        run: conda run -n actgpr pip install -e . --no-deps
      - name: Run tests (unit, integration, regression)
        run: conda run -n actgpr pytest tests/

  docs:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install poetry
        run: pipx install poetry
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "poetry"
      - name: Install dependencies
        run: poetry install
      - name: Build docs (warnings are errors)
        run: poetry run sphinx-build -W docs docs/build/html
      - name: Upload docs artifact
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/build/html

  deploy-docs:
    needs: docs
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
